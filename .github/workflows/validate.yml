name: Validate Controller

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check Node syntax
        run: |
          node --check server.js
          node --check persistent-auth.js
          node --check public-stats-preload.js
          find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify required controller assets
        run: |
          test -f public/index.html
          test -f public/controller-runtime.js
          test -f public/app.js
          test -f public/admin-logs.js
          test -f public/teamkill-monitor.js
